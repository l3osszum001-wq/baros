<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Gallery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f5efe6; color: #4a3f35; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { color: #8a7b6e; font-size: 1.1rem; }
        .gallery-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .gallery-item { background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: transform 0.3s ease; }
        .gallery-item:hover { transform: translateY(-5px); }
        .gallery-item img { width: 100%; height: auto; display: block; object-fit: cover; }
        .item-info { padding: 15px; font-size: 0.9rem; text-align: center; color: #6e6153; }
    </style>
</head>
<body>

    <header>
        <h1>My 3D Character Collection</h1>
        <p>รวมภาพตัวละคร 3D สุดน่ารัก</p>
    </header>

    <div class="gallery-container">
        <div class="gallery-item"><img src="3D_character_based_on_woman_202605060014 (1).jpeg"><div class="item-info">Character 1</div></div>
        <div class="gallery-item"><img src="3D_character_based_on_woman_202605060014.jpeg"><div class="item-info">Character 2</div></div>
        <div class="gallery-item"><img src="AI_image_prompt_template_202605112313 (1).jpeg"><div class="item-info">Character 3</div></div>
        <div class="gallery-item"><img src="AI_image_prompt_template_202605112313 (2).jpeg"><div class="item-info">Character 4</div></div>
        <div class="gallery-item"><img src="AI_image_prompt_template_202605112313 (3).jpeg"><div class="item-info">Character 5</div></div>
        <div class="gallery-item"><img src="AI_image_prompt_template_202605112313.jpeg"><div class="item-info">Character 6</div></div>
        <div class="gallery-item"><img src="Cartoon_3D_character_based_on_202605060019.jpeg"><div class="item-info">Character 7</div></div>
        <div class="gallery-item"><img src="Cartoon_3D_character_standing_room_202605060014 (1).jpeg"><div class="item-info">Character 8</div></div>
        <div class="gallery-item"><img src="Cartoon_3D_character_standing_room_202605060014 (2).jpeg"><div class="item-info">Character 9</div></div>
        <div class="gallery-item"><img src="Cartoon_3D_character_standing_room_202605060014.jpeg"><div class="item-info">Character 10</div></div>
    </div>

</body>
</html>
